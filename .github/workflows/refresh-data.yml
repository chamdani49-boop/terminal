name: Refresh data from Google Sheets

# ═══════════════════════════════════════════════════════════════════════
# 4 MODE REFRESH:
#
#  live      — tiap 5 menit, HANYA Live Sheet (harga + % + high/low).
#              Cache check: kalau ≥98% harga identik → skip commit.
#              Aktif 7 hari seminggu (termasuk weekend — closing tetap
#              valid sebagai cache kalau market tutup).
#
#  consensus — tiap 3 hari sekali jam 06:00 UTC, Senin–Jumat saja.
#              Jadwal cron: tgl 1,4,7,10,13,16,19,22,25,28 jam 06:00.
#              Di bash: cek hari (MON-FRI), kalau Sabtu/Minggu → skip.
#              Fetch: Consensus Sheet + Live Sheet (tidak fetch History).
#
#  history   — tgl 1–5 setiap bulan jam 01:00 UTC.
#              Fetch semua sheet. Rolling window 121 bulan aktif.
#              Jaga-jaga kalau update Google Sheet terlambat/lupa.
#
#  full      — tiap 15 menit, semua sheet.
#              Untuk update reguler History + Consensus + Live.
#              Note: mode full overlap dengan cron live (*/5) dan cron
#              consensus, tapi mode detection memastikan tidak double.
# ═══════════════════════════════════════════════════════════════════════

on:
  schedule:
    # MODE LIVE: tiap 5 menit — hanya Live Sheet
    - cron: '*/5 * * * *'
    # MODE CONSENSUS: tgl 1,4,7,10,13,16,19,22,25,28 jam 06:00 UTC (≈3 harian)
    - cron: '0 6 1,4,7,10,13,16,19,22,25,28 * *'
    # MODE HISTORY: tgl 1–5 jam 01:00 UTC — full re-fetch + rolling window
    - cron: '0 1 1-5 * *'
    # MODE FULL: tiap 15 menit — semua sheet
    - cron: '*/15 * * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: live | consensus | history | full'
        required: false
        default: 'full'

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Deteksi mode dari waktu eksekusi ────────────────────────────────
      # Prioritas (tinggi ke rendah):
      #   1. workflow_dispatch input  → pakai langsung
      #   2. Tanggal 1-5 jam 01:xx   → history
      #   3. Tanggal di set consensus (1,4,7,...,28) jam 06:xx → consensus
      #      KECUALI hari Sabtu (6) atau Minggu (0) → skip (exit 0)
      #   4. Menit tidak habis dibagi 15 → live  (cron */5 non-quarter)
      #   5. Lainnya → full (cron */15)
      #
      # Overlap handling:
      #   - Tgl 1 jam 01:xx → history (priority lebih tinggi dari consensus)
      #   - Tgl 1 jam 06:xx → consensus (bukan jam 01, bukan history)
      #   - Tgl 1,4,... menit non-quarter → live (cron */5, bukan jam 06)
      - name: Determine refresh mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
            MODE="${MODE:-full}"
            echo "mode=$MODE" >> "$GITHUB_OUTPUT"
            echo "🔧 Manual dispatch — mode: $MODE"
            exit 0
          fi

          DAY=$(date -u +%-d)
          HOUR=$(date -u +%-H)
          MIN=$(date -u +%-M)
          DOW=$(date -u +%u)   # 1=Mon ... 6=Sat, 7=Sun

          echo "📅 UTC: day=$DAY hour=$HOUR min=$MIN dow=$DOW"

          # 1. History: tgl 1-5 jam 01:xx
          if [ "$DAY" -le 5 ] && [ "$HOUR" -eq 1 ]; then
            MODE="history"

          # 2. Consensus: tgl 1,4,7,10,13,16,19,22,25,28 jam 06:xx, Senin-Jumat
          elif [ "$HOUR" -eq 6 ] && [ $(( (DAY - 1) % 3 )) -eq 0 ]; then
            if [ "$DOW" -ge 6 ]; then
              echo "⏭  Hari Sabtu/Minggu — consensus skip."
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            MODE="consensus"

          # 3. Live: menit tidak habis dibagi 15 (cron */5 murni)
          elif [ $(( MIN % 15 )) -ne 0 ]; then
            MODE="live"

          # 4. Full: quarter-hour (cron */15)
          else
            MODE="full"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "🔧 Refresh mode: $MODE"

      # ── Skip kalau mode=skip (Sabtu/Minggu consensus) ──────────────────
      - name: Skip if weekend consensus
        if: steps.mode.outputs.mode == 'skip'
        run: echo "Weekend skip — no action needed."

      # ── Build data.json ─────────────────────────────────────────────────
      - name: Build data.json
        if: steps.mode.outputs.mode != 'skip'
        env:
          HISTORY_SHEET_ID:   ${{ secrets.HISTORY_SHEET_ID }}
          HISTORY_GID:        ${{ secrets.HISTORY_GID }}
          CONSENSUS_SHEET_ID: ${{ secrets.CONSENSUS_SHEET_ID }}
          CONSENSUS_GID:      ${{ secrets.CONSENSUS_GID }}
          LIVE_SHEET_ID:      ${{ secrets.LIVE_SHEET_ID }}
          LIVE_GID:           ${{ secrets.LIVE_GID }}
          REFRESH_MODE:       ${{ steps.mode.outputs.mode }}
        run: node scripts/build-data.js --mode=${{ steps.mode.outputs.mode }}

      # ── Commit hanya kalau data berubah ─────────────────────────────────
      - name: Commit & push if data changed
        if: steps.mode.outputs.mode != 'skip'
        id: commit
        run: |
          if git diff --quiet -- public/data.json; then
            echo "⏭  No data changes — cache hit, skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "data-refresh[bot]"
          git config user.email "data-refresh@economstock.local"
          git add public/data.json
          git commit -m "data: refresh $(date -u +%FT%TZ) [mode=${{ steps.mode.outputs.mode }}] [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # ── Purge jsDelivr CDN hanya kalau ada commit ───────────────────────
      - name: Purge jsDelivr CDN cache
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: |
          response=$(curl -fsS \
            "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/public/data.json")
          echo "Purge response: $response"
          if echo "$response" | grep -q '"status":"finished"'; then
            echo "✓ jsDelivr cache purged"
          else
            echo "⚠️  Purge response unexpected (non-fatal)"
          fi
