# Auto-deploy Worker "tracker-input" ke Cloudflare setiap kali ada perubahan
# di folder tracker-input/ yang masuk ke branch main.
#
# PRASYARAT (sekali saja): tambahkan repo secret CLOUDFLARE_API_TOKEN
#   GitHub ▸ Settings ▸ Secrets and variables ▸ Actions ▸ New repository secret
#   Name : CLOUDFLARE_API_TOKEN
#   Value: token dari Cloudflare (My Profile ▸ API Tokens ▸ Create Token ▸
#          template "Edit Cloudflare Workers"). account_id sudah ada di
#          tracker-input/wrangler.toml sehingga tidak perlu di-set di sini.
#
# Secret Worker (APP_PASSWORD, GAS_URL, GAS_TOKEN, TELEGRAM_*) TIDAK tersentuh
# oleh deploy ini — sekali di-set via `wrangler secret put`, nilainya tetap.
name: Deploy tracker-input

on:
  push:
    branches: [main]
    paths:
      - "tracker-input/**"
      - ".github/workflows/deploy-tracker-input.yml"
  workflow_dispatch: {} # bisa dijalankan manual dari tab Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy ke Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: tracker-input
