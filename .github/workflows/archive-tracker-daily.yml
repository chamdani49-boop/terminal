name: Archive Tracker (Daily upsert Sheet -> tracker-history.json)

# ═══════════════════════════════════════════════════════════════════════
# Setiap hari, tarik seluruh baris "approved" dari Google Sheet Tracker
# lalu upsert ke public/tracker-history.json (dedup by stableItemKey,
# sheet menang saat konflik). Cumulative arsip ini di-baca oleh
# scripts/build-tracker.js supaya visual web TETAP TAMPIL data historis
# meski sheet di-wipe user setiap tgl 1.
#
# JADWAL:
#   - Cron GitHub tiap hari jam 12:00 UTC (= 19:00 WIB).
#     Jam 19 WIB dipilih karena market sudah tutup (16:00 WIB) + rec
#     baru hari ini sudah stabil + belum menyentuh window arsip bulanan
#     (01:00 WIB tgl 1).
#   - Bisa dipicu manual dari tab Actions → Run workflow (untuk backfill
#     atau uji integrasi).
#
# PRASYARAT SECRET (sekali saja):
#   - TRACKER_SHEET_ID   : ID Google Sheet Tracker (sama dgn refresh-tracker.yml)
#   - TRACKER_SHEET_TAB  : (opsional) nama tab, default "Tracker"
#
# TIDAK BUTUH Apps Script / OAuth. Sheet cukup di-share "Anyone with the
# link → Viewer" (persyaratan yg sudah ada untuk workflow refresh-tracker).
# ═══════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '0 12 * * *'   # tiap hari 12:00 UTC = 19:00 WIB
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Group SAMA dgn refresh-tracker supaya tidak race saat kedua workflow
  # nulis file di public/ + push ke main bersamaan.
  group: tracker-write
  cancel-in-progress: false

jobs:
  archive-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run archive-tracker (daily upsert)
        env:
          TRACKER_SHEET_ID:  ${{ secrets.TRACKER_SHEET_ID }}
          TRACKER_SHEET_TAB: ${{ secrets.TRACKER_SHEET_TAB }}
        run: |
          node scripts/archive-tracker.js --daily

      - name: Commit & push if changed
        id: commit
        run: |
          # Hanya commit kalau tracker-history.json BERUBAH (dedup by
          # stableItemKey berarti no-op runs tidak menghasilkan diff).
          if git diff --quiet -- public/tracker-history.json; then
            echo "⏭  No tracker-history.json changes — skip commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "tracker-archive[bot]"
          git config user.email "tracker-archive@economstock.local"
          git add public/tracker-history.json
          git commit -m "tracker: archive daily $(date -u +%FT%TZ)"

          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "✓ Pushed on attempt $attempt"
              pushed=true
              break
            fi
            echo "⚠️  Push gagal (attempt $attempt) — rebase ke origin/main lalu retry…"
            git pull --rebase --autostash origin main || true
            sleep $(( (RANDOM % 5) + 2 ))
          done

          if [ "$pushed" != "true" ]; then
            echo "FATAL: push gagal setelah 5 percobaan."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Purge jsDelivr CDN cache
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: |
          response=$(curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/public/tracker-history.json" || true)
          echo "Purge tracker-history.json: $response"
