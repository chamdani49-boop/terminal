name: Refresh macro (Global) dari Yahoo Finance

# ═══════════════════════════════════════════════════════════════════════
# Membangun public/macro.json untuk menu "Global":
#   - grafik indeks ternormalisasi USD (IHSG vs SPX vs MXAPJ)
#   - tabel Asset Class Return & Volatility (1Y & 5Y)
#
# Sumber: Yahoo Finance v8 chart API (bulanan). Di-fetch dari GitHub Actions
# runner (internet bebas) → hasil disajikan sebagai JSON statis via jsDelivr/
# Cloudflare. Browser pengguna tidak pernah menyentuh Yahoo (anti-blokir).
#
# JADWAL:
#   - Mingguan: Senin 23:00 UTC (= Selasa 06:00 WIB). Data return/volatilitas
#     bergerak lambat, jadi cukup seminggu sekali.
#   - workflow_dispatch: jalankan manual kapan saja (mis. untuk mengisi grafik
#     pertama kali setelah fitur ini di-merge).
# ═══════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '0 23 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-macro
  cancel-in-progress: false

jobs:
  refresh-macro:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build macro.json
        run: node scripts/build-macro.js

      - name: Commit & push if changed
        id: commit
        run: |
          if git diff --quiet -- public/macro.json; then
            echo "⏭  No macro changes — skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "macro-refresh[bot]"
          git config user.email "macro-refresh@economstock.local"
          git add public/macro.json
          git commit -m "macro: refresh $(date -u +%FT%TZ) [skip ci]"

          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "✓ Pushed on attempt $attempt"
              pushed=true
              break
            fi
            echo "⚠️  Push gagal (attempt $attempt) — rebase ke origin/main lalu retry…"
            git pull --rebase --autostash origin main || true
            sleep $(( (RANDOM % 5) + 2 ))
          done

          if [ "$pushed" != "true" ]; then
            echo "FATAL: push gagal setelah 5 percobaan."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Purge jsDelivr CDN cache
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: |
          response=$(curl -fsS \
            "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/public/macro.json")
          echo "Purge response: $response"
