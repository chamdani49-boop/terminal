name: Fetch daily candle data (OHLC)

# ═══════════════════════════════════════════════════════════════════════
# Fetch data OHLC harian dari Yahoo Finance untuk saham-saham yang ada
# di consensus_slim. Jalan setiap hari kerja jam 17:00 WIB (10:00 UTC)
# setelah market tutup.
#
# Smart caching: hanya fetch hari-hari baru yang belum ada di cache.
# File output: public/candles.json
# ═══════════════════════════════════════════════════════════════════════

on:
  schedule:
    # Senin-Jumat jam 10:00 UTC = 17:00 WIB (setelah market close 15:00 + buffer)
    - cron: '0 10 * * 1-5'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-candles
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch candle data
        run: node scripts/fetch-candles.js

      - name: Commit & push if candles changed
        id: commit
        run: |
          if git diff --quiet -- public/candles.json; then
            echo "⏭  No candle changes — skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "candle-fetch[bot]"
          git config user.email "candle-fetch@economstock.local"
          git add public/candles.json
          git commit -m "candles: update $(date -u +%FT%TZ) [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Purge jsDelivr CDN cache
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: |
          response=$(curl -fsS \
            "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/public/candles.json")
          echo "Purge response: $response"
          if echo "$response" | grep -q '"status":"finished"'; then
            echo "✓ jsDelivr candles cache purged"
          else
            echo "⚠️  Purge response unexpected (non-fatal)"
          fi
