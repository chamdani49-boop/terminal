name: Refresh data from Google Sheets

on:
  schedule:
    # Every 15 minutes. Adjust if you want faster/slower refreshes.
    # GitHub Actions cron minimum is 5 minutes (and they may queue under load).
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Allows manual "Run workflow" button in the Actions tab.

# Grant the GITHUB_TOKEN write permission so the workflow can push commits.
permissions:
  contents: write

# Prevent overlapping runs (slow runs would otherwise pile up).
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build data.json from Google Sheets
        env:
          HISTORY_SHEET_ID:   ${{ secrets.HISTORY_SHEET_ID }}
          HISTORY_GID:        ${{ secrets.HISTORY_GID }}
          CONSENSUS_SHEET_ID: ${{ secrets.CONSENSUS_SHEET_ID }}
          CONSENSUS_GID:      ${{ secrets.CONSENSUS_GID }}
          LIVE_SHEET_ID:      ${{ secrets.LIVE_SHEET_ID }}
          LIVE_GID:           ${{ secrets.LIVE_GID }}
        run: node scripts/build-data.js

      - name: Commit & push if data changed
        id: commit
        run: |
          if git diff --quiet -- public/data.json; then
            echo "No data changes detected — skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "data-refresh[bot]"
          git config user.email "data-refresh@economstock.local"
          git add public/data.json
          git commit -m "data: refresh $(date -u +%FT%TZ) [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Frontend fetches data.json langsung dari jsDelivr CDN (lihat
      # public/index.html). jsDelivr cache `@main` ~12 jam by default,
      # tapi kita purge eksplisit di sini supaya update kelihatan dalam
      # ~1 menit di browser user.
      #
      # Kenapa pakai jsDelivr & gak Cloudflare Pages: commit message
      # punya tag `[skip ci]` (perlu untuk hindari hit limit 500 builds/
      # bulan di CF Pages free tier dengan cron tiap 15 menit). CF Pages
      # respect [skip ci] → skip deploy → data.json di production stale.
      # jsDelivr fetch langsung dari git, gak peduli deploy state.
      # NOTE: jsDelivr migrasi purge API ke GET (bukan POST). Sebelumnya
      # workflow ini pakai POST → selalu balik 405 MethodNotAllowed → cache
      # nyangkut sampai natural expiry (~12 jam). Akibatnya frontend serve
      # data stale meski commit baru sudah masuk main. Pakai GET sekarang.
      - name: Purge jsDelivr CDN cache
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: |
          response=$(curl -fsS \
            "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/public/data.json")
          echo "Purge response: $response"
          if echo "$response" | grep -q '"status":"finished"'; then
            echo "✓ jsDelivr cache purged"
          else
            echo "⚠️  Purge response unexpected (non-fatal — cache will expire ~12h)"
          fi
