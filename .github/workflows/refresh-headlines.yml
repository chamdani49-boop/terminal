name: Refresh Headlines (berita pasar)

# ═══════════════════════════════════════════════════════════════════════
# Tarik berita terbaru dari beberapa portal (CNBC, Kontan, Bisnis.com,
# Bloomberg Technoz, EmitenNews, InvestorTrust, Stockwatch) via Google News
# RSS, lalu tulis/gabung ke public/headlines.json (retensi 3 hari, maks 80).
# Frontend (Pasar Live → Headlines) membaca file ini via jsDelivr CDN.
#
# Tidak memakai Gemini/Telegram — murni fetch + tulis JSON.
# ═══════════════════════════════════════════════════════════════════════

on:
  schedule:
    # Tiap ~15 menit, tapi DIGESER dari menit :00 (07,22,37,52).
    # GitHub Actions menunda/men-drop run terjadwal saat beban tinggi —
    # dan beban paling tinggi tepat di awal jam (menit :00). Menggeser
    # jadwal menjauh dari :00 = rekomendasi resmi GitHub agar run lebih
    # andal benar-benar tereksekusi.
    #
    # Jam aktif: HANYA 06:00–22:00 WIB (di luar itu berhenti, hemat run).
    # cron GitHub Actions pakai UTC, WIB = UTC + 7, jadi:
    #   06:00 WIB = 23:00 UTC (hari sebelumnya)
    #   22:00 WIB = 15:00 UTC
    # → jam UTC aktif = 0-15,23 (run pertama ~06:07 WIB, terakhir ~22:52 WIB).
    - cron: '7,22,37,52 0-15,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-headlines
  cancel-in-progress: false

jobs:
  refresh-headlines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build headlines.json
        run: python scripts/fetch_headlines.py

      - name: Commit & push if changed
        id: commit
        run: |
          if git diff --quiet -- public/headlines.json; then
            echo "⏭  No headline changes — skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "headlines-refresh[bot]"
          git config user.email "headlines-refresh@economstock.local"
          git add public/headlines.json
          git commit -m "headlines: refresh $(date -u +%FT%TZ) [skip ci]"

          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "✓ Pushed on attempt $attempt"
              pushed=true
              break
            fi
            echo "⚠️  Push gagal (attempt $attempt) — rebase ke origin/main lalu retry…"
            git pull --rebase --autostash origin main || true
            sleep $(( (RANDOM % 5) + 2 ))
          done

          if [ "$pushed" != "true" ]; then
            echo "FATAL: push gagal setelah 5 percobaan."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Purge jsDelivr CDN cache
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: |
          response=$(curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/public/headlines.json")
          echo "Purge headlines.json: $response"
