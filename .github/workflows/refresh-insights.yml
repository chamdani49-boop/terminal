name: Refresh Insights (Economstock)

# ═══════════════════════════════════════════════════════════════════════
# Tarik artikel "Insight" milik sendiri dari economstock.com (situs Blogger →
# feed RSS label resmi, tanpa scraping), lalu tulis/gabung ke
# public/insights.json (source="Economstock", cat="insight").
# Frontend (Pasar Live → Headlines) menggabungkannya ke daftar berita dan
# menyediakan filter kategori "Insight".
#
# Beda dari headlines:
#   - Insight, bukan berita harian → retensi panjang (90 hari / 3 bulan).
#   - Ditarik jarang: 2x/hari (cukup, karena insight jarang terbit).
#
# Tidak memakai Gemini/Telegram — murni fetch + tulis JSON.
# ═══════════════════════════════════════════════════════════════════════

on:
  schedule:
    # 2x/hari, digeser dari menit :00 agar run terjadwal lebih andal:
    #   01:13 UTC = 08:13 WIB (pagi) dan 13:13 UTC = 20:13 WIB (malam).
    - cron: '13 1,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-insights
  cancel-in-progress: false

jobs:
  refresh-insights:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build insights.json
        run: python scripts/fetch_insights.py

      - name: Commit & push if changed
        id: commit
        run: |
          if git diff --quiet -- public/insights.json; then
            echo "⏭  No insight changes — skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "insights-refresh[bot]"
          git config user.email "insights-refresh@economstock.local"
          git add public/insights.json
          git commit -m "insights: refresh $(date -u +%FT%TZ) [skip ci]"

          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "✓ Pushed on attempt $attempt"
              pushed=true
              break
            fi
            echo "⚠️  Push gagal (attempt $attempt) — rebase ke origin/main lalu retry…"
            git pull --rebase --autostash origin main || true
            sleep $(( (RANDOM % 5) + 2 ))
          done

          if [ "$pushed" != "true" ]; then
            echo "FATAL: push gagal setelah 5 percobaan."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Purge jsDelivr CDN cache
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: |
          response=$(curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/public/insights.json")
          echo "Purge insights.json: $response"
