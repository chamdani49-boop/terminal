#:schema node_modules/wrangler/config-schema.json
# ════════════════════════════════════════════════════════════════════════
# terminal-live — Worker feed harga live real-time
# ════════════════════════════════════════════════════════════════════════
# Worker ini TERPISAH dari site statis utama (terminal.chamdani49.workers.dev)
# supaya deploy site yang sudah jalan TIDAK terganggu.
#
# Setelah deploy, URL-nya jadi:
#   https://terminal-live.<SUBDOMAIN-AKUN-KAMU>.workers.dev/live.json
# Untuk akun "chamdani49" → https://terminal-live.chamdani49.workers.dev/live.json
#
# Cara deploy lengkap ada di worker/README.md
# ════════════════════════════════════════════════════════════════════════

name = "terminal-live"
main = "src/index.js"
compatibility_date = "2025-05-01"

# Worker dapat subdomain *.workers.dev otomatis.
workers_dev = true

# ── Variabel non-rahasia (opsional) ──
# CACHE_SECONDS: lama cache hasil di edge (detik). Default 60 kalau kosong.
# ALLOW_ORIGIN : batasi CORS ke origin tertentu. Default "*" (semua).
[vars]
CACHE_SECONDS = "60"
ALLOW_ORIGIN = "*"
# STALE_TTL_SECONDS: lama "data terakhir yang baik" disimpan sebagai cadangan
# saat Google Sheet error → Worker tetap menyajikan harga terakhir sampai sheet
# pulih. Default 43200 (12 jam) kalau kosong.
STALE_TTL_SECONDS = "43200"
# CONSENSUS_CACHE_SECONDS / HISTORY_CACHE_SECONDS: lama cache edge untuk endpoint
# /consensus.json & /history.json. Konsensus & history jarang berubah → boleh
# lebih panjang dari harga live. Default 120 (konsensus) & 600 (history).
CONSENSUS_CACHE_SECONDS = "120"
HISTORY_CACHE_SECONDS = "600"

# ── Rahasia (JANGAN ditaruh di file ini) ──
# Set lewat CLI sekali saja:
#   wrangler secret put LIVE_SHEET_ID
#   wrangler secret put LIVE_GID
#   wrangler secret put CONSENSUS_SHEET_ID   # untuk /consensus.json
#   wrangler secret put CONSENSUS_GID
#   wrangler secret put HISTORY_SHEET_ID     # untuk /history.json
#   wrangler secret put HISTORY_GID
#
# Nilainya SAMA dengan GitHub Secrets yang dipakai scripts/build-data.js.
# Catatan: /consensus.json juga ikut memakai LIVE_SHEET_ID/LIVE_GID (opsional)
# untuk menghitung pct_d (upside) — sama seperti build-data. Kalau tidak di-set,
# pct_d diambil dari kolom sheet (kalau ada).
#
# Atau, kalau kamu nggak keberatan ID-nya ada di repo (data sheet sudah publik),
# bisa juga pindahkan ke blok [vars] di atas. Tapi pakai secret lebih rapi.
