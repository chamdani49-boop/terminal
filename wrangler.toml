#:schema node_modules/wrangler/config-schema.json
# ════════════════════════════════════════════════════════════════════════
# ROOT wrangler.toml — Worker "terminal"
#
# Sebelumnya: murni static assets (folder public/).
# Sekarang: Worker script (src/index.js) + static assets, untuk mendukung
# login, langganan berbayar (Mayar), dan dashboard admin.
#
# AMAN untuk situs live:
#   - `run_worker_first = ["/api/*"]` → Worker HANYA dijalankan untuk route
#     /api/*. Semua file lain (index.html, data.json, ohlc.json, dst) tetap
#     dilayani LANGSUNG sebagai static asset seperti sebelumnya — tanpa
#     melewati Worker. Jadi performa & perilaku situs publik tidak berubah.
#   - Feature flag GATING_ENABLED=false → gate langganan belum aktif. Situs
#     tetap terbuka untuk semua sampai auth+billing siap & flag dinyalakan.
#   - Binding D1 sengaja DIKOMENTARI sampai database dibuat (lihat
#     docs/AUTH_SETUP.md). Kalau di-uncomment dengan database_id palsu,
#     `wrangler deploy` akan GAGAL dan menghentikan deploy data.json. Jadi:
#     buat D1 dulu, isi id-nya, baru uncomment.
# ════════════════════════════════════════════════════════════════════════

name = "terminal"
main = "src/index.js"
compatibility_date = "2025-05-01"

# Static Assets — serve folder public/ sebagai situs statis.
# `binding = "ASSETS"` memungkinkan Worker mengambil file via env.ASSETS.fetch().
# `run_worker_first` membatasi eksekusi Worker hanya ke /api/* (hemat & aman).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/data.json", "/valuation.json", "/ohlc.json", "/macro.json", "/insights.json", "/headlines.json", "/dashboard"]

# Variabel non-rahasia (boleh publik). Rahasia (SESSION_SECRET, GOOGLE_*,
# MAYAR_*, LIVE_TOKEN_SECRET, RESEND_API_KEY) di-set via dashboard / `wrangler secret put`.
[vars]
GATING_ENABLED = "true"
APP_URL = "https://terminal.economstock.com"
# Daftar email admin, dipisah koma. Mis: "chamdani49@gmail.com"
ADMIN_EMAILS = "chamdani49@gmail.com"
# Durasi paket (hari)
PLAN_DAYS_3BULAN = "90"
PLAN_DAYS_6BULAN = "182"
PLAN_DAYS_TAHUNAN = "365"

# ── Database D1 ──
[[d1_databases]]
binding = "DB"
database_name = "terminal-db"
database_id = "d943f1cd-77fc-4929-87d4-0e526357968b"
