name: Refresh data from Google Sheets

# ═══════════════════════════════════════════════════════════════════════
# 3 MODE REFRESH (Opsi A — tanpa mode "full" terjadwal):
#
#  live      — tiap 5 menit, HANYA Live Sheet (harga + % + high/low).
#              Jam kerja bursa: Senin–Jumat, 08:00–17:00 WIB.
#              (= 01:00–10:00 UTC). Sabtu & Minggu TIDAK ada fetch.
#              Cache check: kalau ≥98% harga identik → skip commit.
#
#  consensus — seminggu sekali, Senin 07:00 WIB (= Senin 00:00 UTC).
#              Fetch: Consensus Sheet + Live Sheet (tidak fetch History).
#
#  history   — tgl 1–5 setiap bulan, 08:00 WIB (= 01:00 UTC).
#              Fetch semua sheet. Rolling window 121 bulan aktif.
#              Range tgl 1–5 (bukan tgl 3 spesifik) sebagai jaring
#              pengaman kalau update Google Sheet terlambat/lupa.
#
#  full      — TIDAK dijadwalkan lagi. Hanya tersedia lewat manual
#              workflow_dispatch (mode default = full) untuk re-fetch
#              penuh semua sheet bila diperlukan.
#
# Catatan timezone: cron GitHub Actions memakai UTC. WIB = UTC + 7.
# ═══════════════════════════════════════════════════════════════════════

on:
  schedule:
    # MODE LIVE: tiap 5 menit, Senin–Jumat, 01:00–09:55 UTC (08:00–16:55 WIB)
    - cron: '*/5 1-9 * * 1-5'
    # MODE LIVE: tick penutup 10:00 UTC = 17:00 WIB, Senin–Jumat
    - cron: '0 10 * * 1-5'
    # MODE CONSENSUS: Senin 00:00 UTC = Senin 07:00 WIB (seminggu sekali)
    - cron: '0 0 * * 1'
    # MODE HISTORY: tgl 1–5 jam 01:00 UTC = 08:00 WIB — full re-fetch + rolling window
    - cron: '0 1 1-5 * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: live | consensus | history | full'
        required: false
        default: 'full'

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Deteksi mode dari waktu eksekusi (UTC) ──────────────────────────
      # Prioritas (tinggi ke rendah):
      #   1. workflow_dispatch input          → pakai langsung
      #   2. tgl 1-5 & jam 01:00 UTC          → history
      #   3. Senin & jam 00:00 UTC            → consensus
      #   4. sisanya (semua trigger cron live) → live
      #
      # Kenapa "sisanya → live": setelah Opsi A, satu-satunya cron lain
      # adalah cron live (Senin–Jumat 01:00–10:00 UTC). Jadi trigger
      # terjadwal apa pun yang bukan history/consensus pasti berasal dari
      # cron live. Tidak ada cron live di akhir pekan → weekend otomatis
      # tidak pernah fetch.
      #
      # Overlap tgl 1-5 jam 01:00: cron history dan cron live sama-sama
      # menyala. Karena concurrency group serial (cancel-in-progress:false),
      # run kedua jalan setelah run pertama selesai dan umumnya kena
      # cache-hit (tidak commit). Aman, hanya sedikit boros.
      - name: Determine refresh mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
            MODE="${MODE:-full}"
            echo "mode=$MODE" >> "$GITHUB_OUTPUT"
            echo "🔧 Manual dispatch — mode: $MODE"
            exit 0
          fi

          DAY=$(date -u +%-d)
          HOUR=$(date -u +%-H)
          MIN=$(date -u +%-M)
          DOW=$(date -u +%u)   # 1=Mon ... 6=Sat, 7=Sun

          echo "📅 UTC: day=$DAY hour=$HOUR min=$MIN dow=$DOW"

          # 1. History: tgl 1-5 jam 01:00 UTC (= 08:00 WIB)
          if [ "$DAY" -le 5 ] && [ "$HOUR" -eq 1 ] && [ "$MIN" -eq 0 ]; then
            MODE="history"

          # 2. Consensus: Senin jam 00:00 UTC (= Senin 07:00 WIB)
          elif [ "$DOW" -eq 1 ] && [ "$HOUR" -eq 0 ] && [ "$MIN" -eq 0 ]; then
            MODE="consensus"

          # 3. Live: semua trigger cron live lainnya (Senin–Jumat, jam kerja)
          else
            MODE="live"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "🔧 Refresh mode: $MODE"

      # ── Build data.json ─────────────────────────────────────────────────
      - name: Build data.json
        env:
          HISTORY_SHEET_ID:   ${{ secrets.HISTORY_SHEET_ID }}
          HISTORY_GID:        ${{ secrets.HISTORY_GID }}
          CONSENSUS_SHEET_ID: ${{ secrets.CONSENSUS_SHEET_ID }}
          CONSENSUS_GID:      ${{ secrets.CONSENSUS_GID }}
          LIVE_SHEET_ID:      ${{ secrets.LIVE_SHEET_ID }}
          LIVE_GID:           ${{ secrets.LIVE_GID }}
          META_SHEET_ID:      ${{ secrets.META_SHEET_ID }}
          META_GID:           ${{ secrets.META_GID }}
          SECTORNAMA_SHEET_ID: ${{ secrets.SECTORNAMA_SHEET_ID }}
          SECTORNAMA_GID:     ${{ secrets.SECTORNAMA_GID }}
          SCREENER_GID:       ${{ secrets.SCREENER_GID }}
          SECTORNAMA_SCREENER_GID: ${{ secrets.SECTORNAMA_SCREENER_GID }}
          REFRESH_MODE:       ${{ steps.mode.outputs.mode }}
        run: node scripts/build-data.js --mode=${{ steps.mode.outputs.mode }}

      # ── Commit hanya kalau data berubah ─────────────────────────────────
      # Push pakai rebase + retry: workflow OHLC (refresh-ohlc.yml) push ke
      # branch main yang sama dengan concurrency group berbeda, jadi bisa
      # terjadi race (non-fast-forward) terutama jam 10:00 UTC. Loop ini
      # rebase ke main terbaru lalu coba lagi, agar job tidak gagal.
      - name: Commit & push if data changed
        id: commit
        run: |
          if git diff --quiet -- public/data.json; then
            echo "⏭  No data changes — cache hit, skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "data-refresh[bot]"
          git config user.email "data-refresh@economstock.local"

          # [skip ci] HANYA untuk mode live (commit tiap 5 menit) — supaya tidak
          # memicu rebuild Cloudflare Pages terus-menerus. Harga live sudah
          # ditangani Worker /live.json, jadi same-origin data.json TIDAK perlu
          # selalu fresh untuk harga.
          #
          # Mode consensus/history/full JARANG terjadi → BIARKAN memicu rebuild
          # Cloudflare Pages (tanpa [skip ci]) supaya same-origin /data.json ikut
          # ter-update. Ini PENTING saat repo private: jsDelivr hanya jalan untuk
          # repo public, jadi saat private UI mengandalkan same-origin Pages.
          MODE="${{ steps.mode.outputs.mode }}"
          SKIP_CI=""
          if [ "$MODE" = "live" ]; then SKIP_CI=" [skip ci]"; fi

          git add public/data.json
          git commit -m "data: refresh $(date -u +%FT%TZ) [mode=$MODE]$SKIP_CI"

          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "✓ Pushed on attempt $attempt"
              pushed=true
              break
            fi
            echo "⚠️  Push gagal (attempt $attempt) — rebase ke origin/main lalu retry…"
            git pull --rebase --autostash origin main || true
            sleep $(( (RANDOM % 5) + 2 ))
          done

          if [ "$pushed" != "true" ]; then
            echo "FATAL: push gagal setelah 5 percobaan."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # ── Purge jsDelivr CDN hanya kalau ada commit ───────────────────────
      - name: Purge jsDelivr CDN cache
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: |
          response=$(curl -fsS \
            "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/public/data.json")
          echo "Purge response: $response"
          if echo "$response" | grep -q '"status":"finished"'; then
            echo "✓ jsDelivr cache purged"
          else
            echo "⚠️  Purge response unexpected (non-fatal)"
          fi
