name: Refresh harga tutup-tahun (Yahoo, untuk valuasi <2016)

# ═══════════════════════════════════════════════════════════════════════
# Bangun public/history-yearly.json = close tutup-tahun per saham dari Yahoo
# (sejak 2005). Dipakai build-valuation.py sebagai FALLBACK mengisi harga
# tahunan Excel yang 'Libur' di tahun <2016 (price_history hanya mulai 2016).
#
# Cadence MINGGUAN: data tahun lampau jarang berubah. Bisa juga dijalankan
# manual (workflow_dispatch) — disarankan sekali setelah merge agar dataset
# langsung terisi, lalu valuasi berikutnya otomatis memakainya.
# ═══════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '30 18 * * 0'      # Minggu 18:30 UTC (sekali seminggu)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-yearly-close
  cancel-in-progress: false

jobs:
  refresh-yearly-close:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build history-yearly.json
        run: node scripts/build-yearly-close.js

      # SENGAJA TANPA [skip ci] supaya commit ter-deploy & ikut ke repo (dibaca
      # build-valuation saat refresh-valuation berikutnya). Cadence mingguan → aman.
      - name: Commit & push if changed
        run: |
          if git diff --quiet -- public/history-yearly.json; then
            echo "⏭  Tidak ada perubahan — skip commit."
            exit 0
          fi
          git config user.name  "yearly-close[bot]"
          git config user.email "yearly-close@economstock.local"
          git add public/history-yearly.json
          git commit -m "yearly-close: refresh $(date -u +%FT%TZ)"
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push; then pushed=true; break; fi
            git pull --rebase --autostash origin main || true
            sleep $(( (RANDOM % 5) + 2 ))
          done
          [ "$pushed" = "true" ] || { echo "FATAL: push gagal"; exit 1; }
