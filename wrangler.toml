#:schema node_modules/wrangler/config-schema.json
# ════════════════════════════════════════════════════════════════════════
# ROOT wrangler.toml — deploy site statis sebagai Cloudflare Worker (Static Assets)
#
# CF project "terminal" terhubung ke repo via Git dan menjalankan
# `npx wrangler deploy` setiap push ke main. Tanpa config ini, command tsb
# gagal dengan error:
#   "Missing entry-point to Worker script or to assets directory"
#
# Config di bawah memberi tahu wrangler untuk men-deploy folder `public/`
# sebagai static assets (tanpa perlu script Worker / `main`). File statis
# (index.html, data.json, ohlc.json, _headers) langsung di-serve dari edge.
#
# Worker `terminal-live` (folder worker/) adalah proyek TERPISAH — di-deploy
# manual via `wrangler deploy` dari dalam folder tersebut.
# ════════════════════════════════════════════════════════════════════════

name = "terminal"
compatibility_date = "2025-05-01"

# Static Assets — serve folder public/ sebagai situs statis.
# `_headers` & `_redirects` di public/ tetap didukung (sama seperti Pages).
[assets]
directory = "./public"
