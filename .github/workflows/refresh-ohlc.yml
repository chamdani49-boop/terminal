name: Refresh OHLC harian dari Yahoo Finance

# ═══════════════════════════════════════════════════════════════════════
# Fetch candle HARIAN (open/high/low/close) untuk semua ticker yang punya
# rekomendasi analis, lalu tulis ke public/ohlc.json. Dipakai frontend untuk
# render candlestick di popup detail rekomendasi.
#
# KENAPA terpisah dari refresh-data.yml?
#   - Cadence beda: OHLC cukup 1x sehari setelah bursa tutup (data candle
#     final). Tidak perlu ikut cron 5/15 menit.
#   - Sumber beda: Yahoo Finance (bukan Google Sheets).
#   - Isolasi: kalau Yahoo error, refresh data.json utama tidak terganggu.
#
# JADWAL:
#   - 10:00 UTC = 17:00 WIB (jam 5 sore) — data candle final Yahoo biasanya
#     sudah tersedia 30 menit setelah bursa IDX tutup jam 16:30 WIB.
#     Tarik jam 17:00 WIB lebih hemat kuota & menghindari blokir karena
#     traffic Yahoo saat peak-hour belum seramai sore/malam.
#   - Hanya Senin–Jumat (skip Sabtu & Minggu) — bursa libur, tidak ada
#     candle baru, tidak ada gunanya tarik data.
# ═══════════════════════════════════════════════════════════════════════

on:
  schedule:
    # 10:00 UTC = 17:00 WIB, Senin–Jumat (0=Sun,1=Mon,...,5=Fri,6=Sat)
    # Cron GitHub tidak support filter hari kerja langsung → filter di step bash.
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      full:
        description: 'Set "true" untuk fetch ulang penuh (abaikan cache)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: refresh-ohlc
  cancel-in-progress: false

jobs:
  refresh-ohlc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Skip Sabtu & Minggu (bursa libur, tidak ada candle baru) ────────
      # Hanya untuk run terjadwal (cron). Manual dispatch selalu jalan.
      # Cron sudah di-set 1-5 (Senin–Jumat UTC), tapi step ini sebagai
      # safeguard eksplisit kalau ada edge case timezone.
      - name: Skip on weekend (scheduled only)
        id: dow
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DOW=$(date -u +%u)   # 1=Mon ... 6=Sat, 7=Sun
            if [ "$DOW" -ge 6 ]; then
              echo "⏭  Weekend (Sabtu/Minggu) — bursa libur, skip OHLC refresh."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # ── Build ohlc.json ────────────────────────────────────────────────
      - name: Build ohlc.json
        if: steps.dow.outputs.skip != 'true'
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            node scripts/build-ohlc.js --full
          else
            node scripts/build-ohlc.js
          fi

      # ── Commit hanya kalau berubah ─────────────────────────────────────
      - name: Commit & push if changed
        if: steps.dow.outputs.skip != 'true'
        id: commit
        run: |
          if git diff --quiet -- public/ohlc.json; then
            echo "⏭  No OHLC changes — skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "ohlc-refresh[bot]"
          git config user.email "ohlc-refresh@economstock.local"
          git add public/ohlc.json
          git commit -m "ohlc: refresh $(date -u +%FT%TZ) [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # ── Purge jsDelivr CDN cache ───────────────────────────────────────
      - name: Purge jsDelivr CDN cache
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: |
          response=$(curl -fsS \
            "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/public/ohlc.json")
          echo "Purge response: $response"
          if echo "$response" | grep -q '"status":"finished"'; then
            echo "✓ jsDelivr cache purged"
          else
            echo "⚠️  Purge response unexpected (non-fatal)"
          fi
